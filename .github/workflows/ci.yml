name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # 凭据持久化依赖 Windows DPAPI,backend 测试必须在 Windows 上跑。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Companion Core
        run: |
          pip install -r ./companion-core/requirements.lock.txt
          pip install -e ./companion-core
      - name: Run backend tests
        working-directory: companion-core
        run: python -m unittest discover -s tests -v
